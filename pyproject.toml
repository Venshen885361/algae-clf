[project]
name = "algae-clf"
version = "0.1.0"
description = "Species-level algae (diatom) image classification — science fair baseline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.7",          # 2.7 = first stable with RTX 50xx (sm_120) support
  "torchvision>=0.22",
  "open-clip-torch",     # BioCLIP 2 / 2.5 loader (hf-hub:imageomics/...)
  "timm>=1.0",
  "pandas",
  "scikit-learn",
  "pillow",
  "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algae"]

# RTX 5090 (Blackwell) 需要 CUDA 12.8+ wheel；只讓 torch 系列走 PyTorch index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
